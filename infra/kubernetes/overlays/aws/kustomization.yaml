apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: standingsos
resources:
  - ../../base
commonLabels:
  deployment-target: aws
patches:
  - target:
      kind: Service
      name: frontend
    patch: |-
      - op: add
        path: /spec/type
        value: LoadBalancer
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
