[project]
name = "standingsos-backend"
version = "2.2.1"
description = "StandingsOS competition intelligence API"
requires-python = ">=3.11"
authors = [{ name = "Carlos Saritama" }]
license = { text = "MIT" }
dependencies = [
    "fastapi==0.128.2",
    "starlette==0.50.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy==2.0.50",
    "pydantic==2.13.4",
    "psycopg[binary]>=3.2.0",
    "httpx==0.28.1",
    "python-multipart==0.0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff==0.17.3",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
