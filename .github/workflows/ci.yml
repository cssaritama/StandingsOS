name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend quality and unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Lint backend
        run: uv run ruff check app tests
      - name: Run tests
        run: uv run pytest -q
      - name: Verify OpenAPI contract is current
        run: uv run python ../scripts/check_openapi.py

  backend-postgres:
    name: PostgreSQL integration test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: standingsos_test
          POSTGRES_USER: standingsos
          POSTGRES_PASSWORD: standingsos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U standingsos -d standingsos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://standingsos:standingsos_test@127.0.0.1:5432/standingsos_test
      RUN_POSTGRES_TESTS: "1"
      AUTO_CREATE_SCHEMA: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Run PostgreSQL integration test
        run: uv run pytest -q tests/test_postgres_integration.py

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  containers:
    name: Container build and Compose validation
    runs-on: ubuntu-24.04
    needs: [backend-unit, backend-postgres, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build -t standingsos-api:ci ./backend
      - name: Build frontend image
        run: docker build --build-arg VITE_API_BASE_URL= -t standingsos-web:ci ./frontend
